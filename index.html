<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nextcloud Data Uploader</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #18222d);
      --text-color: var(--tg-theme-text-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #7f8c8d);
      --button-color: var(--tg-theme-button-color, #2ea6ff);
      --button-text-color: var(--tg-theme-button-text-color, #ffffff);
      --secondary-bg: var(--tg-theme-secondary-bg-color, #212d3b);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-color); padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .header { display: flex; align-items: center; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .header-icon { width: 36px; height: 36px; background: #0082c9; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .user-card { background: var(--secondary-bg); padding: 10px; border-radius: 8px; font-size: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    label { font-size: 12px; color: var(--hint-color); }
    input, select, textarea { width: 100%; padding: 10px; background: var(--secondary-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; color: var(--text-color); outline: none; }
    .btn-submit { width: 100%; padding: 12px; background: var(--button-color); color: var(--button-text-color); border: none; border-radius: 8px; font-weight: bold; margin-top: 14px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">☁️</div>
    <div>
      <h3 style="font-size: 15px;">Input Data Nextcloud</h3>
      <p style="font-size: 11px; color: var(--hint-color);">Kirim data langsung ke Localhost</p>
    </div>
  </div>

  <div class="user-card">
    👤 <b id="userName">User Telegram</b> (<span id="userId">ID</span>)
  </div>

  <div class="form-group">
    <label>Judul Dokumen / Catatan</label>
    <input type="text" id="title" placeholder="Contoh: Catatan Luwak" required>
  </div>

  <div class="form-group">
    <label>Pilih Folder Nextcloud</label>
    <select id="folder">
      <option value="/Gambar">/Gambar</option>
      <option value="/Dokumen">/Dokumen</option>
      <option value="/">/ (Root Folder)</option>
    </select>
  </div>

  <div class="form-group">
    <label>Catatan Tambahan</label>
    <textarea id="description" rows="3" placeholder="Isi deskripsi..."></textarea>
  </div>

  <button type="button" class="btn-submit" onclick="simpanData()">🚀 Simpan ke Nextcloud</button>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const user = tg.initDataUnsafe?.user;
    if (user) {
      document.getElementById('userName').innerText = `${user.first_name} ${user.last_name || ''}`;
      document.getElementById('userId').innerText = user.id;
    }

    function simpanData() {
      const title = document.getElementById('title').value;
      const folder = document.getElementById('folder').value;
      const description = document.getElementById('description').value;

      if (!title) {
        tg.showAlert('Judul dokumen tidak boleh kosong!');
        return;
      }

      // Payload data yang dikirim ke Telegram Bot (bot.py)
      const payload = {
        title: title,
        folder: folder,
        description: description
      };

      tg.sendData(JSON.stringify(payload));
    }
  </script>
</body>
</html>
